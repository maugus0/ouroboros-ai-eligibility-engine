# OuroborosAI Eligibility Engine — CI/CD
#
# Triggers:
#   - pull_request (main, develop): full CI except Trivy and GHCR push.
#   - push (main only): same CI + push image to GHCR + Trivy scan on the pushed image.
#
# Action major tags (verify on GitHub releases):
#   actions/checkout@v6 — https://github.com/actions/checkout/releases
#   actions/setup-python@v6 — https://github.com/actions/setup-python/releases
#   actions/upload-artifact@v6 — https://github.com/actions/upload-artifact/releases
#   docker/setup-buildx-action@v4 — https://github.com/docker/setup-buildx-action/releases
#   docker/build-push-action@v7 — https://github.com/docker/build-push-action/releases
#
# Older action bundles shipped with Node 20; newer majors run on Node 24.
# See: https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/

name: OuroborosAI Eligibility Engine CI/CD Pipeline

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prompt-lint:
    name: Prompt Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run prompt lint tests
        run: pytest tests/unit/test_prompt_lint.py -v --tb=short --junitxml=prompt-lint-junit.xml

      - name: Upload prompt lint results
        if: always() && hashFiles('prompt-lint-junit.xml') != ''
        uses: actions/upload-artifact@v6
        with:
          name: prompt-lint-results
          path: prompt-lint-junit.xml
          retention-days: 7

  prompt-diff-alert:
    name: Prompt Diff Alert
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed prompt files
        id: prompt_diff
        run: |
          CHANGED=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" -- prompts/*.json || true)
          {
            echo "changed<<EOF"
            echo "$CHANGED"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Add or update PR comment
        if: steps.prompt_diff.outputs.changed != ''
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- prompt-diff-alert -->';
            const changed = `${{ steps.prompt_diff.outputs.changed }}`.trim().split('\n').filter(Boolean);
            const body = `${marker}

            Prompt files changed in this PR:

            ${changed.map(file => `- \`${file}\``).join('\n')}

            CI will run prompt lint on this PR, and full LLM evaluation will run on main pushes.`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(comment => comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  format-check:
    name: Code Formatting (Black & isort)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check formatting (Black)
        run: black --check --diff app/ tests/

      - name: Check import sorting (isort)
        run: isort --check-only --diff app/ tests/

  lint-check:
    name: Lint & Code Quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run flake8
        run: flake8 app/ tests/ --max-line-length=120 --extend-ignore=E203,W503,E501

      - name: Run pylint
        run: pylint app/ tests/

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run unit tests
        env:
          ALLOW_DB_FAILURE: "true"
          USE_MOCK_DATA: "true"
          INTERNAL_TOKEN_VERIFY_ENABLED: "true"
          INTERNAL_TOKEN_SIGNING_ALGORITHM: "HS256"
          INTERNAL_TOKEN_PUBLIC_KEY: "internal-test-signing-key-with-32-bytes"
          INTERNAL_TOKEN_ISSUER: "ouroboros-orchestrator-internal"
          INTERNAL_TOKEN_AUDIENCE: "ouroboros.eligibility-engine"
          POSTGRES_HOST: "localhost"
          POSTGRES_DATABASE: "test_db"
          POSTGRES_USER: "test_user"
          POSTGRES_PASSWORD: "test_pass"
        run: pytest tests/unit/ -v --tb=short --junitxml=junit-report.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: junit-report.xml
          retention-days: 7

  type-check:
    name: Type Checking (mypy)
    runs-on: ubuntu-latest
    needs: [prompt-lint, format-check, lint-check, unit-tests]
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run mypy
        run: mypy app/ --ignore-missing-imports --no-strict-optional

  integration-tests:
    name: Tests with Coverage
    runs-on: ubuntu-latest
    needs: [prompt-lint, format-check, lint-check, unit-tests]
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        env:
          ALLOW_DB_FAILURE: "true"
          USE_MOCK_DATA: "true"
          INTERNAL_TOKEN_VERIFY_ENABLED: "true"
          INTERNAL_TOKEN_SIGNING_ALGORITHM: "HS256"
          INTERNAL_TOKEN_PUBLIC_KEY: "internal-test-signing-key-with-32-bytes"
          INTERNAL_TOKEN_ISSUER: "ouroboros-orchestrator-internal"
          INTERNAL_TOKEN_AUDIENCE: "ouroboros.eligibility-engine"
          POSTGRES_HOST: "localhost"
          POSTGRES_DATABASE: "test_db"
          POSTGRES_USER: "test_user"
          POSTGRES_PASSWORD: "test_pass"
        run: pytest tests/ --cov=app --cov-report=html --cov-report=xml -v

      - name: Upload coverage report (HTML)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 7

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7

  security-static:
    name: Security Scan (Bandit)
    runs-on: ubuntu-latest
    needs: [prompt-lint, format-check, lint-check, unit-tests]
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Bandit
        run: bandit -r app/ -f json -o bandit-report.json

      - name: Upload Bandit report
        if: always() && hashFiles('bandit-report.json') != ''
        uses: actions/upload-artifact@v6
        with:
          name: security-reports-bandit
          path: bandit-report.json
          retention-days: 7

  security-scan:
    name: Security Scan (Snyk OSS)
    runs-on: ubuntu-latest
    needs: [prompt-lint, format-check, lint-check, unit-tests]
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        if: env.SNYK_TOKEN != ''
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies for Snyk dependency graph
        if: env.SNYK_TOKEN != ''
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip freeze > snyk-requirements.txt

      - name: Skip Snyk (no token)
        if: env.SNYK_TOKEN == ''
        run: echo "SNYK_TOKEN not set; skipping Snyk OSS scan. Add repo secret to enforce dependency checks."

      - name: Setup Snyk CLI
        if: env.SNYK_TOKEN != ''
        uses: snyk/actions/setup@v1.0.0

      - name: Snyk Open Source scan (Python requirements)
        if: env.SNYK_TOKEN != ''
        run: |
          snyk auth "$SNYK_TOKEN"
          snyk test \
            --file=snyk-requirements.txt \
            --package-manager=pip \
            --severity-threshold=high \
            --sarif-file-output=snyk.sarif

      - name: Upload Snyk SARIF to Code Scanning
        if: vars.ENABLE_CODE_SCANNING_SARIF == 'true' && env.SNYK_TOKEN != '' && always() && hashFiles('snyk.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk.sarif

      - name: Upload Snyk SARIF artifact
        if: env.SNYK_TOKEN != '' && always() && hashFiles('snyk.sarif') != ''
        uses: actions/upload-artifact@v6
        with:
          name: snyk-sarif
          path: snyk.sarif
          retention-days: 7

  docker-build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs:
      - prompt-lint
      - type-check
      - integration-tests
      - security-static
      - security-scan
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trivy-scan:
    name: Trivy Scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [docker-build]
    permissions:
      contents: read
      packages: read
      security-events: write
      actions: read
    steps:
      - name: Log in to GitHub Container Registry (pull)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner (SARIF)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ github.sha }}
          format: sarif
          output: trivy.sarif

      - name: Upload Trivy SARIF to Code Scanning
        if: vars.ENABLE_CODE_SCANNING_SARIF == 'true' && always() && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif

      - name: Run Trivy vulnerability scanner (JSON artifact)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ github.sha }}
          format: json
          output: trivy-results.json

      - name: Upload Trivy report artifact
        if: always() && hashFiles('trivy-results.json') != ''
        uses: actions/upload-artifact@v6
        with:
          name: trivy-report
          path: trivy-results.json
          retention-days: 7

  llm-eval:
    name: LLM Eval
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [prompt-lint, integration-tests]
    permissions:
      contents: read
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LLM_EVAL_BASELINE_SCORE: ${{ vars.ELIGIBILITY_LLM_EVAL_BASELINE_SCORE }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run LLM evaluation
        env:
          OPENAI_API_KEY: ${{ env.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY is required for llm-eval" >&2
            exit 1
          fi

          if [ -n "$LLM_EVAL_BASELINE_SCORE" ]; then
            python scripts/run_llm_eval.py --baseline-score "$LLM_EVAL_BASELINE_SCORE" --output eval_results.json
          else
            python scripts/run_llm_eval.py --output eval_results.json
          fi

      - name: Upload eval results
        if: always() && hashFiles('eval_results.json') != ''
        uses: actions/upload-artifact@v6
        with:
          name: llm-eval-results
          path: eval_results.json
          retention-days: 7

  reports-summary:
    name: CI/CD Summary
    runs-on: ubuntu-latest
    needs:
      - prompt-lint
      - prompt-diff-alert
      - format-check
      - lint-check
      - unit-tests
      - type-check
      - integration-tests
      - security-static
      - security-scan
      - docker-build
      - trivy-scan
      - llm-eval
    if: always()
    permissions:
      contents: read
      actions: read
    steps:
      - name: Generate Summary
        run: |
          echo "# OuroborosAI Eligibility Engine — CI/CD Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Prompt Lint | ${{ needs.prompt-lint.result == 'success' && 'Passed' || needs.prompt-lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Prompt Diff Alert | ${{ needs.prompt-diff-alert.result == 'success' && 'Passed' || needs.prompt-diff-alert.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Format | ${{ needs.format-check.result == 'success' && 'Passed' || needs.format-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint-check.result == 'success' && 'Passed' || needs.lint-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.unit-tests.result == 'success' && 'Passed' || needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Type Check (mypy) | ${{ needs.type-check.result == 'success' && 'Passed' || needs.type-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests + Coverage | ${{ needs.integration-tests.result == 'success' && 'Passed' || needs.integration-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan (Bandit) | ${{ needs.security-static.result == 'success' && 'Passed' || needs.security-static.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan (Snyk) | ${{ needs.security-scan.result == 'success' && 'Passed' || needs.security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Build/Push | ${{ needs.docker-build.result == 'success' && 'Passed' || needs.docker-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Trivy Scan | ${{ needs.trivy-scan.result == 'success' && 'Passed' || needs.trivy-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| LLM Eval | ${{ needs.llm-eval.result == 'success' && 'Passed' || needs.llm-eval.result }} |" >> $GITHUB_STEP_SUMMARY
