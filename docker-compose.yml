services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: eligibility-postgres
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-root_password}
      POSTGRES_DB: ${DB_NAME:-ouroboros_eligibility_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
    ports:
      - "${DOCKER_POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  eligibility-engine:
    build: .
    container_name: eligibility-engine-service
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8004:8004"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-ouroboros_eligibility_db}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-root_password}
      - ALLOW_DB_FAILURE=false
      - INTERNAL_TOKEN_VERIFY_ENABLED=${INTERNAL_TOKEN_VERIFY_ENABLED:-false}
      - INTERNAL_TOKEN_SIGNING_ALGORITHM=${INTERNAL_TOKEN_SIGNING_ALGORITHM:-RS256}
      - INTERNAL_TOKEN_PUBLIC_KEY=${INTERNAL_TOKEN_PUBLIC_KEY:-internal-test-signing-key-with-32-bytes}
      - INTERNAL_TOKEN_ISSUER=${INTERNAL_TOKEN_ISSUER:-ouroboros-orchestrator-internal}
      - INTERNAL_TOKEN_AUDIENCE=${INTERNAL_TOKEN_AUDIENCE:-ouroboros.eligibility-engine}
      - LOG_LEVEL=DEBUG
    volumes:
      - .:/app
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8004 --reload

volumes:
  postgres_data:
